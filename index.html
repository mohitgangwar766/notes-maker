<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohit Notes Maker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-wrapper">
        <header>
            <button onclick="toggleDarkMode()" id="modeToggleBtn">🌙 Mode</button>
            <h1 class="main-title">Welcome to visiting mohit notes maker site 🤖</h1>
        </header>

        <main>
            <div class="input-section">
                <textarea id="noteInput" placeholder="Write your note here..."></textarea>
                <br>
                <button onclick="addNote()" class="add-btn">Add Note</button>
            </div>

            <div id="notesContainer"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
